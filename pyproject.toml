[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revcat"
version = "0.1.0"
description = "PLC Version Control and Comparison Tool"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "RevCat Team"}
]
keywords = ["plc", "automation", "diff", "comparison", "rockwell", "schneider", "ladder"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control",
]

dependencies = [
    "click>=8.1.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
gui = [
    "PyQt6>=6.5.0",
]
pdf = [
    "reportlab>=4.0.0",
    "svglib>=1.5.0",
]
all = [
    "revcat[gui,pdf]",
]

[project.scripts]
revcat = "revcat.cli.main:cli"

[project.urls]
Homepage = "https://github.com/revcat/revcat"
Documentation = "https://revcat.readthedocs.io"

[tool.setuptools.packages.find]
include = ["revcat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["revcat"]
